source_file: vclamp_iv_steps_001_bessel.atf    # the filtered export, in tests/data/real
original_file_name: "Voltage Clamp IV Steps Bessel.atf"
outputs:
  single: "Voltage Clamp IV Steps Bessel single exp.txt"
  double: "Voltage Clamp IV Steps Bessel double exp.txt"
software_version: "Clampfit (version not recorded)"
exported_on: 2026-10-25
exported_by: LG
analysis: curve_fit
sweeps: all
channel: IN 0C
fit_function: "Exponential, standard"           # 1st and 2nd order
fit_method: null               # search / minimisation / weighting not recorded; ask LG
units: {amplitude: pA, time: ms}
region:
  # Not recorded in the export. Inferred from it: 984 points, the Sum of Data Squared
  # column matches samples 2111 to 3094 exactly, and Cursor 1 Intercept = A + C puts
  # x = 0 at the first fitted sample.
  first_sample: 2111
  last_sample: 3094
  region_ms: [105.55, 154.70]
  cursor_samples: inclusive
x_origin: first_fitted_sample
columns:
  single: {A: 6, A_se: 7, tau: 8, tau_se: 9, C: 10, C_se: 11}
  double: {A1: 6, A1_se: 7, tau1: 8, tau1_se: 9, A2: 10, A2_se: 11, tau2: 12, tau2_se: 13, C: 14, C_se: 15}
  # Header names are used for the rest: "Standard Deviation" is sqrt(SSE / (n - 1));
  # "Correlation Coefficient" and "Fitted Area" do not match the usual definitions and
  # are not compared.
notes: >
  Clampfit's parameters are not least-squares minima for most sweeps: Ephys-Forever's
  fits reach a lower sum of squared errors on every sweep it can fit, so parameters
  are compared through SSE rather than value by value until the fit method is known.
  Single-exponential sweep 2 has tau = -730.6 ms (a rising exponential), outside
  Ephys-Forever's tau > 0 bound, and is excluded from the SSE comparison.
excluded:
  - {fit: single, sweep: 2, reason: "negative tau, outside the model's bounds"}
shareable: false
