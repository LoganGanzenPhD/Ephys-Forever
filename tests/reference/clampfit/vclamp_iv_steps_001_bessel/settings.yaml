source_file: vclamp_iv_steps_001.abf
original_file_name: "Voltage Clamp IV Steps.abf"
output_file: vclamp_iv_steps_001_bessel.atf   # in tests/data/real; "Voltage Clamp IV Steps Bessel.atf"
software_version: "Clampfit (version not recorded)"
exported_on: 2026-10-25
exported_by: LG
analysis: filter
sweeps: all
channel: IN 0C                 # only IN 0C was filtered; IN 0 and IN 1 are unchanged
filter:
  type: bessel_lowpass
  poles: 8
  cutoff_hz: 1000              # as entered in the commercial tool (-3 dB)
reproduced_by:
  # Found by matching the export, not taken from the tool. An 8-pole Bessel prototype
  # (-3 dB normalised) mapped with the matched z-transform, cascaded as four all-pole
  # biquads with unit DC gain, reproduces every sample after the start to the export's
  # 6 significant digits, but only with the cutoff scaled by the factor below. The
  # factor is unexplained; a second export at another cutoff is needed to tell whether
  # it is constant. See docs/differences.md.
  design: matched_z
  cutoff_scale: 1.0016677
  start_samples_excluded: 50
  start_behaviour: >
    The export's first two samples equal the unfiltered input, and the following
    ~20 samples carry a start-up transient (each biquad appears to copy its first two
    input samples). Ephys-Forever starts the filter in steady state instead.
notes: >
  Exported from the ABF to ATF after filtering, values at 6 significant digits.
shareable: false
