[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ephys-forever"
version = "0.0.1"
description = "Open-source, cross-platform analysis of patch-clamp and other electrophysiology recordings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "PyYAML>=6.0",
    "scipy-stubs>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["ephys_forever"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "reference: compares to reference/ outputs",
    "realdata: needs files in tests/data/real (skipped if absent)",
    "slow: takes over ~2 seconds",
    "gui: needs a display or offscreen Qt",
]
